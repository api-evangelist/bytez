aid: bytez
name: Bytez
description: >-
  Bytez is a unified, serverless model-inference API that gives developers access
  to 100,000+ open-source and closed-source AI models (from OpenAI, Anthropic,
  Cohere, Google, Mistral, and the open-source community) through a single API key
  and one consistent endpoint shape. It covers 30+ task types across text, vision,
  audio, multimodal, and generation - including chat, embeddings, transcription,
  image and video generation, translation, and object detection - and offers
  OpenAI-compatible Chat Completions, Completions, and Responses endpoints plus a
  LangChain integration. Bytez manages GPU provisioning and scaling behind the
  scenes and bills on a unified credit system (per second for open models, provider
  pricing for closed models). It is backed by 500 Global.
